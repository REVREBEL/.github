# Canonical label set for REVREBEL org
# Managed by .github/workflows/labels-sync.yml (ghaction-github-labeler)

- name: 'type: bug'
  color: 163666
  description: Something is behaving differently than intended and needs a fix.

- name: 'type: enhancement'
  color: 047c97
  description: Improves an existing feature, workflow, or capability.

- name: 'type: feature'
  color: 047c97
  description: Introduces a new capability, experience, or piece of functionality.

- name: 'type: task'
  color: 71c9c5
  description: A defined unit of work with a clear objective and expected outcome.

- name: 'type: chore'
  color: faca78
  description: Necessary operational work that keeps the project healthy and moving.

- name: 'type: maintenance'
  color: f37d59
  description: Upgrades, refactors, tooling, CI, cleanup, and other system upkeep.

- name: 'type: triage'
  color: e05047
  description: Requires investigation before the root cause or next action is clear.

- name: 'type: security'
  color: e05047
  description: Addresses a vulnerability, security risk, permission issue, or hardening need.

- name: 'type: question'
  color: 8e456a
  description: Requires additional information or a decision before work can continue.

- name: 'type: research'
  color: 8e456a
  description: Investigation needed to answer a question, validate an approach, or inform a decision.

- name: 'type: documentation'
  color: 8e456a
  description: Creates or improves documentation, guides, references, or project context.

- name: 'status: awaiting review'
  color: 8e456a
  description: Implementation is complete and ready for review, testing, or approval.

- name: 'status: working as intended'
  color: 00a6b6
  description: The reported behavior matches the current design or expected system behavior.

- name: 'status: needs reproduction'
  color: faca78
  description: Requires reliable steps, conditions, or evidence to reproduce the reported behavior.

- name: 'status: pending triage'
  color: f37d59
  description: Waiting for initial review, classification, and assignment of next steps.

- name: 'status: 3rd party issue'
  color: 8e456a
  description: The root cause sits outside our codebase in a dependency, provider, API, or external service.

- name: 'priority: low'
  color: B2D3dE
  description: Worth addressing, but unlikely to create meaningful near-term impact if deferred.

- name: 'priority: normal'
  color: 00a6b6
  description: Standard-priority work to be handled through the normal development queue.

- name: 'priority: hot-fix'
  color: f37d59
  description: Requires expedited attention because the issue is materially affecting users or operations.

- name: 'priority: red-alert'
  color: e05047
  description: Immediate, high-impact issue requiring focused attention until the system is stabilized.

- name: 'os: windows'
  color: f37d59
  description: Applies specifically to Windows environments or behavior.

- name: 'os: mac'
  color: FAFAFA
  description: Applies specifically to macOS environments or behavior.

- name: 'os: linux'
  color: 163666
  description: Applies specifically to Linux environments or behavior.

- name: 'agent-location:bridge-server'
  color: f37d59
  description: Routes agent execution to the configured Bridge Server environment.

- name: 'agent-location:mac'
  color: FAFAFA
  description: Routes agent execution to the configured macOS environment.

- name: 'dev-area:backend'
  color: f37d59
  description: Backend services, APIs, business logic, databases, workers, or server-side behavior.

- name: 'dev-area:frontend'
  color: FAFAFA
  description: Frontend application logic, rendering, state, routing, and client-side behavior.

- name: 'product-area:frontend'
  color: FAFAFA
  description: Product-facing frontend experience, behavior, or functionality.

- name: 'dev-area:product'
  color: FAFAFA
  description: Product requirements, behavior, flows, feature definition, or product-level decisions.

- name: 'dev-area:ux'
  color: FAFAFA
  description: User flows, interaction patterns, usability, information architecture, or experience design.

- name: 'dev-area:ui'
  color: FAFAFA
  description: Visual interface implementation, layout, styling, states, and presentation.

- name: 'dev-area:design-system'
  color: FAFAFA
  description: Shared components, tokens, patterns, standards, and design-system infrastructure.

- name: 'dev-area:accessibility'
  color: FAFAFA
  description: Accessibility, semantic structure, keyboard behavior, assistive technology, and inclusive UX.

- name: 'dev-area:prototype'
  color: FAFAFA
  description: Experimental or exploratory work used to test an idea before production implementation.
